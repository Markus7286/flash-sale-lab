apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Pinned: the dashboard JSON references the datasource by uid, and a
    # generated one changes on every fresh Grafana container.
    uid: flash-sale-prom
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
