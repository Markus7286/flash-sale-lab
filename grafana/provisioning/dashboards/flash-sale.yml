apiVersion: 1

providers:
  - name: flash-sale
    type: file
    updateIntervalSeconds: 10
    # The JSON in the repo is the source of truth; edits made in the UI would
    # otherwise win until the next container rebuild.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
