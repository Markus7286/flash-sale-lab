[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
user = www-data
group = www-data

listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; nginx accepts every connection a load test opens and parks the excess here,
; which is what a 1,000-buyer burst needs; compose raises somaxconn to match.
listen.backlog = 4096

; static: a dynamic pool would fork workers during the ramp and bill the fork to
; whichever step it landed in.
pm = static
; Each worker holds one persistent Postgres connection, so this is the PHP side's
; pool size and defaults to the Go api's DB_MAX_CONNS (see compose).
pm.max_children = ${FPM_WORKERS}
pm.max_requests = 0

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
