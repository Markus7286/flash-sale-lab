user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 8192;
}

http {
    access_log off;
    server_tokens off;

    # Go's net/http never closes a keep-alive connection for having served too many
    # requests; nginx's default of 1,000 would make k6 reconnect mid-run.
    keepalive_requests 1000000;
    keepalive_timeout 75s;

    server {
        listen 8090 backlog=4096;
        root /app/public;

        # The 64 KiB contract limit is enforced by the controller, so the 413 is JSON.
        # Buffering the whole allowance keeps bodies off disk, where www-data cannot write.
        client_max_body_size 1m;
        client_body_buffer_size 1m;

        # Every path is an API route; skip try_files and its stat() per request.
        location / {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass unix:/run/php-fpm.sock;
        }
    }
}
