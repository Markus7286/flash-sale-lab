x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-flashsale}:${POSTGRES_PASSWORD:-flashsale}@postgres:5432/${POSTGRES_DB:-flashsale}?sslmode=disable
  REDIS_ADDR: redis:6379
  DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
  PER_USER_LIMIT: ${PER_USER_LIMIT:-1}
  SALE_KEY_TTL: ${SALE_KEY_TTL:-24h}
  STREAM_BATCH_SIZE: ${STREAM_BATCH_SIZE:-100}
  STREAM_CLAIM_IDLE: ${STREAM_CLAIM_IDLE:-30s}
  STREAM_MAX_DELIVERIES: ${STREAM_MAX_DELIVERIES:-5}
  RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-30s}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  METRICS_ADDR: ${METRICS_ADDR:-:8081}

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flashsale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flashsale}
      POSTGRES_DB: ${POSTGRES_DB:-flashsale}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flashsale}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:${REDIS_VERSION:-7}-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      args:
        SERVICE: api
    ports:
      - "${API_PORT:-8080}:8080"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        SERVICE: worker
    ports:
      - "${WORKER_METRICS_PORT:-8081}:8081"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.14.0}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  # No volume on purpose: provisioning is the source of truth, and a stale one
  # would shadow every later change to the dashboard.
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.2}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/flash-sale.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
