global:
  # A bench run lasts 30s. The usual 15s would sample it twice.
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: api

  # The worker serves /metrics on its own listener; see METRICS_ADDR.
  - job_name: worker
    static_configs:
      - targets: ["worker:8081"]
        labels:
          service: worker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
